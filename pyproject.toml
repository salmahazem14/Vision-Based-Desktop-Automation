[project]
name = "notepad-screenseeker"
version = "0.1.0"
description = "Vision-based desktop automation with ScreenSeekeR GUI grounding, applied to a Notepad workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pillow>=10.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "mss>=9.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.8",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# Real model backends. Installed on the GPU machine that runs the grounder.
grounder = [
    "torch>=2.2",
    "transformers>=4.45",
    "accelerate>=0.30",
    "pytesseract>=0.3.10",
]
planner = [
    "openai>=1.30",
]
# Default free path: one Gemini key for BOTH grounder and planner (no GPU).
gemini = [
    "openai>=1.30",   # Gemini via its OpenAI-compatible endpoint
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
notepad-screenseeker = "screenseeker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screenseeker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
